apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-llama-serve-monitor
  namespace: model-deploy
spec:
  namespaceSelector: {}
  podMetricsEndpoints:
    - bearerTokenSecret:
        key: ''
      interval: 30s
      path: /metrics
  selector:
    matchLabels:
      app: isvc.edge-inference-predictor
