apiVersion: v1
kind: Secret
metadata:
  name: thanos-object-storage
  namespace: open-cluster-management-observability
type: Opaque
stringData:
  thanos.yaml: |
    type: s3
    config:
      bucket: thanos
      endpoint: minio-service.s3acic.svc.cluster.local:9000
      insecure: true
      access_key: minio
      secret_key: minio123
      http_config:
        tls_config:
          insecure_skip_verify: true
