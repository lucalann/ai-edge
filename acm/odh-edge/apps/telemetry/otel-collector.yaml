apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: cluster-collector
  namespace: opendatahub-edge-collector
  labels:
    app.kubernetes.io/managed-by: opentelemetry-operator
spec:
  mode: deployment
  observability:
    metrics:
      enableMetrics: true
  config: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              job_name: otel-collector
              metrics_path: /metrics
              scrape_interval: 5s
              static_configs:
                - targets:
                    - edge-inference-predictor-model-deploy.apps.singlenodeopenshift.acic.local
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        metrics:
          exporters:
            - prometheus
          receivers:
            - prometheus
