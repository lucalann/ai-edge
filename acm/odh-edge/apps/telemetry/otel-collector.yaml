apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: opendatahub-edge-collector
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: otel-serving-cert
spec:
  mode: deployment
  replicas: 1
  volumes:
    - name: mco-ca
      secret:
        secretName: observability-managed-cluster-certs
    - name: mco-certs
      secret:
        secretName: observability-controller-open-cluster-management.io-observability-signer-client-cert
  volumeMounts:
    - name: mco-ca
      mountPath: /etc/mco/ca
    - name: mco-certs
      mountPath: /etc/mco/certs
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              job_name: model-metrics
              metrics_path: /metrics
              scrape_interval: 5s
              static_configs:
                - targets:
                    - edge-inference-predictor-model-deploy.apps.singlenodeopenshift.acic.local
    processors:
      transform/label_fix:
        metrics:
          - include: ".*"       # tutte le metriche
            action: update_label
            label: handler      # qui puoi aggiungere altre label come "method", ecc.
            new_label: handler
            value: "unknown"
            match_type: strict
            regex: "^$"
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: source
            value: rhde
            action: insert
          # Rimuove label che causano errori 409
          - key: process.executable.path
            action: delete
          - key: process.command
            action: delete
          - key: process.command_line
            action: delete
    exporters:
      debug:
        verbosity: detailed
      prometheusremotewrite:
        endpoint: https://observatorium-api-open-cluster-management-observability.apps.baremetal2.acic.local/api/metrics/v1/default/api/v1/receive
        tls:
          cert_file: /etc/mco/certs/tls.crt
          key_file: /etc/mco/certs/tls.key
          ca_file: /etc/mco/ca/ca.crt
          insecure: true
          insecure_skip_verify: true
        resource_to_telemetry_conversion:
          enabled: true
        auth:
          authenticator: bearertokenauth
    extensions:
      bearertokenauth:
        token: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjhkWHhoRER4R09PM1pHRXNMSlBWTmRQZDl0aWVVcHpKbVYxX3ZMaEpNTVEifQ"
    service:
      extensions:
        - bearertokenauth
      pipelines:
        metrics:
          receivers:
            - prometheus
          processors:
            - memory_limiter
            - resource
            - transform/label_fix
            - batch
          exporters:
            - debug
            - prometheusremotewrite
