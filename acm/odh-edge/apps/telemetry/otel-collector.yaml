apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: open-cluster-management-observability
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: otel-serving-cert
spec:
  mode: deployment
  replicas: 1
  volumes:
    - name: mco-ca
      secret:
        secretName: observability-managed-cluster-certs
    - name: mco-certs
      secret:
        secretName: observability-controller-open-cluster-management.io-observability-signer-client-cert
    - name: otel-certs
      secret:
        secretName: otel-serving-cert
  volumeMounts:
    - name: mco-ca
      mountPath: /etc/mco/ca
    - name: mco-certs
      mountPath: /etc/mco/certs
    - name: otel-certs
      mountPath: /etc/otel/certs
  config:
    exporters:
      debug:
        verbosity: detailed
      prometheusremotewrite:
        endpoint: https://thanos-querier-openshift-monitoring.apps.baremetal2.acic.local/api/v1/write
        tls:
          cert_file: /etc/mco/certs/tls.crt
          key_file: /etc/mco/certs/tls.key
          ca_file: /etc/mco/ca/ca.crt
        resource_to_telemetry_conversion:
          enabled: true
        auth:
          authenticator: bearertokenauth

        tls:
          ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
          insecure: true
          insecure_skip_verify: true

        debug:
          verbosity: detailed

    extensions:
      bearertokenauth:
        token: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjhkWHhoRER4R09PM1pHRXNMSlBWTmR
