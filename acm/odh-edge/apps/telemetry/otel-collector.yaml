apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: cluster-collector
  namespace: open-cluster-management-addon-observability
spec:
  mode: deployment
  observability:
    metrics:
      enableMetrics: true

  config: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: model-metrics
              metrics_path: /metrics
              scrape_interval: 5s
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                    - edge-inference-predictor-model-deploy.apps.singlenodeopenshift.acic.local

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      attributes:
        actions:
          - key: source
            value: "edge-collector"
            action: insert
      filtermetrics:
        metrics:
          include:
            match_type: strict
            metric_names:
              - vllm:request_generation_tokens_sum

    exporters:
      prometheusremotewrite:
        endpoint: "https://observatorium-api-open-cluster-management-observability.apps.baremetal2.acic.local/api/metrics/v1/default/api/v1/receive"
        auth:
          authenticator: bearertokenauth
        tls:
          insecure_skip_verify: true

      logging:
        loglevel: debug

    extensions:
      bearertokenauth:
        token: "e
