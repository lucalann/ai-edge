    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      filter/metrics:
        metrics:
          include:
            match_type: strict
            metric_names:
              - vllm:generation_tokens_total
      attributes/drop-empty:
        actions:
          - key: server.port
            action: delete
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/otel/certs/tls.crt
              key_file: /etc/otel/certs/tls.key
      prometheus:
        config:
          scrape_configs:
            - job_name: thanos
              scrape_interval: 5s
              scheme: http
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                    - "edge-inference-predictor-model-deploy.apps.singlenodeopenshift.acic.local"
              tls_config:
                insecure_skip_verify: true
    service:
      pipelines:
        metrics:
          receivers:
            - otlp
            - prometheus
          processors:
            - memory_limiter
            #- resource
            - batch
            - filter/metrics
            - attributes/drop-empty
          exporters:
            - debug
            - prometheusremotewrite