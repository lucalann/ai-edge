apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: cluster-collector
  namespace: open-cluster-management-addon-observability
spec:
  mode: deployment
  replicas: 1
  volumes:
    - name: mco-ca
      secret:
        secretName: observability-managed-cluster-certs
    - name: mco-certs
      secret:
        secretName: observability-controller-open-cluster-management.io-observability-signer-client-cert
  volumeMounts:
    - name: mco-ca
      mountPath: /etc/mco/ca
    - name: mco-certs
      mountPath: /etc/mco/certs

  config: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: model-metrics
              metrics_path: /metrics
              scrape_interval: 5s
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                    - edge-inference-predictor-model-deploy.apps.singlenodeopenshift.acic.local

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      attributes:
        actions:
          - key: source
            value: "edge-collector"
            action: insert
          - key: engine
            action: upsert
            value: unknown
            - key: model_name
              action: upsert
              value: unknown
      filter:
        metrics:
          include:
            match_type: regexp
            metric_names:
              - vllm*

    exporters:
      prometheusremotewrite:
        endpoint: "https://observatorium-api-open-cluster-management-observability.apps.baremetal2.acic.local/api/metrics/v1/default/api/v1/receive"
        auth:
          authenticator: bearertokenauth
        tls:
          insecure: true
          insecure_skip_verify: true
          cert_file: /etc/mco/certs/tls.crt
          key_file: /etc/mco/certs/tls.key
          ca_file: /etc/mco/ca/ca.crt
        resource_to_telemetry_conversion:
          enabled: true

      debug:
        verbosity: detailed

    extensions:
      bearertokenauth:
        token: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjhkWHhoRER4R09PM1pHRXNMSlBWTmRQZDl0aWVVcHpKbVYxX3ZMaEpNTVEifQ..NcsgnA7c3bWHO8verbsAv0Yy7skFP083Pg3YmZ_9IQdqdwwzUhw4zobCgZEWBTYlNSY3fBogSYtVU6kmzO3ohnQQ04pEYrrvDCwTDXT5L0OM_AYFy3g6Kr2sI78G_1ArW-p4k-8nHsXyQtguuU8kI5mSS2X3KuIgXXTcPKMo24h4_7EctA5qtpcYokGRWXS9k2rbbNf9U2e9i5yj_XaJL9463i_jLC-lff2_spaJIzLY26YwlKALqNHG0T5Gi8eekgK8-byWy601uKPvqJP8oJdgOcfY411HOjbij279k8YjMVF_ETIQiJmWSKR0OhsLEejL_48XwBjoZBRH88g2oxYZq47DX2HRam8Ec02ZxIUbiKO2WHjHihikhOUBKOqqOq9bWRuJFutBSXZWYi6RTASwRh1apMN4QqtXY5N3VyRXWSSf7WIYWgamdPLytfZ5QFipxvW04omIJ5WaLlTKyw3Rz15IJ6CTb9dvVVE6ioDutr8rJrtZD-1HAo1bOwTluDGUAKOzoNqNXbzs0qNk49FjqkfznrxTrFp1CwZOQAfKFjTZO8veam0fI0IqDdOVZefq9hti_YDuhv1uBC31T9JWudCM310BKNrP42ZIyUdf4V-qHMnQcCMedHtpKxs66BrajuXLNgXdkdZWADeWTjMvFwy_M43QtRVSbOEDRZQ"

