apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: opendatahub-edge-collector
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: otel-serving-cert
spec:
  mode: deployment
  replicas: 1
  volumes:
    - name: mco-ca
      secret:
        secretName: observability-managed-cluster-certs
    - name: mco-certs
      secret:
        secretName: observability-controller-open-cluster-management.io-observability-signer-client-cert
  volumeMounts:
    - name: mco-ca
      mountPath: /etc/mco/ca
    - name: mco-certs
      mountPath: /etc/mco/certs
  config:
    exporters:
      debug:
        verbosity: detailed
      prometheusremotewrite:
        endpoint: https://observatorium-api-open-cluster-management-observability.apps.baremetal2.acic.local/api/metrics/v1/default/api/v1/receive
        tls:
          cert_file: /etc/mco/certs/tls.crt
          key_file: /etc/mco/certs/tls.key
          ca_file: /etc/mco/ca/ca.crt
          insecure: true
          insecure_skip_verify: true
        remote_write_relabel_configs:
          - source_labels: [handler]
            regex: ^$
            replacement: "unknown"
            action: replace
        resource_to_telemetry_conversion:
          enabled: true
        auth:
          authenticator: bearertokenauth
    extensions:
      bearertokenauth:
        token: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjhkWHhoRER4R09PM1pHRXNMSlBWTmRQZDl0aWVVcHpKbVYxX3ZMaEpNTVEifQ..R0Jr7ve3HBEM2jwzy3NGPjMP5NqRsjeiO51nVnIeey58wFLGKjzYSRKiobkhVnhDxUHcBoR2QXOrjTfLKgrk4ywIJONCZ_adbmCUYGSURm8MXtL7cYzzZY82eVqhwh28HRiSyps5K479u7feuu7tW7wlQVhomnhgOzpYIg4if17sa1TiQ8XmH23fxKxuKkcDlk3MRMBT0kHPTTOqsky4Bu0NdHis5jqoYSykFSncTg6ZfTi3NGQ95BhM-G2pDjBHZW6JycKQZTCdtrKtthFuBB1o-qORkFaMA2y9FreCEvkHOwvCxfo-QCES-EeZIzQL2mnn-Fm_7DI-0J0PFI5ZbrvAwcUQxDzUQs2uvDPq60L39Z-ZHLVyBOkjDMEPzN1EVIkor51C6ZKutUltpvLr51d-6gbJk7Fd0JvCWM_2L-wRYCgxQHQQ4qSznjqeTzpQFxElueqL3jqfT0dpy0d7NTdUb0kURotG3Xg2xvtNUdjTb-TykFHkxgMDO8cACy2jZbdLH9aodTaTwLuv6Wqkntzqfl0hHzZPBXQDCd4WfM_b_xETCHhK94v6R1cg5B097QiP5_4NTyW1mc-JkXq05IXr2GIhlAfimatYj41KX7PMFd57FeLFUq1Gtvfj2oC9HslPgZ_shncEp7fcwbnL4w_1I6JREJuZI7RgaKvnawY"
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: source
            value: rhde
            action: insert
          # fix "Permanent error: Permanent error: Permanent error: remote write returned HTTP status 409 Conflict; err = %!w(<nil>): add 1377 series: label set contains a label with empty name or value
          - key: process.executable.path
            action: delete
          - key: process.command
            action: delete
          - key: process.command_line
            action: delete
    receivers:
      prometheus:
        config:
          scrape_configs:
            - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              job_name: model-metrics
              metrics_path: /metrics
              scrape_interval: 5s
              static_configs:
                - targets:
                    - edge-inference-predictor-model-deploy.apps.singlenodeopenshift.acic.local
    service:
      extensions: 
        - bearertokenauth
      pipelines:
        metrics:
          receivers:
            - prometheus
          processors:
            - memory_limiter
            - resource
            - batch
          exporters:
            - debug
            - prometheusremotewrite